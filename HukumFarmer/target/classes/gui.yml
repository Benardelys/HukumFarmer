    name: "<yellow><bold>Çiftçiyi Yeniden Adlandır</bold></yellow>"
    lore:
      - "<gray>Çiftçinize özel bir isim verin.</gray>"
      - ""
      - "<gray>Mevcut İsim: <white>%farmer_name%</white></gray>"
      - ""
      - "<yellow>▶ Sohbete yeni ismi yazmak için tıkla!</yellow>"

  toggle-harvest:
    slot: 12
    material: "DIAMOND_HOE"
    name: "<green><bold>Otomatik Hasat</bold></green>"
    lore:
      - "<gray>Durum: %auto_harvest_status%"
      - ""
      - "<yellow>▶ Değiştirmek için tıkla!</yellow>"

  toggle-sell:
    slot: 14
    material: "EMERALD"
    name: "<light_purple><bold>Otomatik Satış</bold></light_purple>"
    lore:
      - "<gray>Durum: %auto_sell_status%"
      - ""
      - "<yellow>▶ Değiştirmek için tıkla!</yellow>"

  language-button:
    slot: 16
    material: "BOOK"
    name: "<aqua><bold>🌐 Dil Değiştir</bold></aqua>"
    lore:
      - "<gray>Dil tercihinizi güncelleyin.</gray>"
      - ""
      - "<yellow>▶ Tıkla ve dili seç!</yellow>"

  back-button:
    slot: 22
    material: "ARROW"
    name: "<red><bold>Geri Dön</bold></red>"
    lore:
      - "<gray>Ana menüye dönmek için tıklayın.</gray>"
