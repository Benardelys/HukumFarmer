        - ""
        - "<gray>Estado: %auto_harvest_status%"
        - ""
        - "<yellow>▶ ¡Haz clic para alternar!</yellow>"
    auto-sell-toggle:
      name: "<light_purple><bold>Venta Automática</bold></light_purple>"
      lore:
        - "<gray>Vende automáticamente los cultivos"
        - "<gray>recolectados a cambio de dinero."
        - ""
        - "<gray>Estado: %auto_sell_status%"
        - ""
        - "<yellow>▶ ¡Haz clic para alternar!</yellow>"
    stats-button:
      name: "<blue><bold>Estadísticas del Granjero</bold></blue>"
      lore:
        - "<gray>Consulta el historial de cosecha"
        - "<gray>y ganancias totales obtenidas."
        - ""
        - "<gray>Total Cosechado: <yellow>%total_harvested% unidades</yellow></gray>"
        - "<gray>Ganancias Totales: <green>%total_earnings%$</green></gray>"
        - ""
        - "<yellow>▶ ¡Haz clic para ver detalles!</yellow>"
    language-button:
      name: "<aqua><bold>🌐 Ajustes de Idioma</bold></aqua>"
      lore:
        - "<gray>Cambia tu idioma preferido."
        - ""
        - "<yellow>▶ ¡Haz clic para abrir idiomas!</yellow>"
    close-button:
