        - ""
        - "<yellow>▶ ¡Haz clic para abrir el almacén!</yellow>"
    upgrade-button:
      name: "<aqua><bold>Mejoras del Granjero</bold></aqua>"
      lore:
        - "<gray>Mejora el nivel de tu granjero para"
        - "<gray>aumentar su capacidad y velocidad."
