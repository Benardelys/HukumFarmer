# Traducciones de GUI
gui:
  main-menu:
    title: "<gold><bold>Panel de Gestión del Granjero</bold></gold>"
    farmer-info:
      name: "<yellow><bold>%farmer_name%</bold></yellow>"
      lore:
        - "<gray>Propietario: <gold>%owner%</gold></gray>"
        - "<gray>Nivel: <aqua>%level%</aqua></gray>"
        - "<gray>Experiencia: <green>%xp% / %required_xp% XP</green></gray>"
        - "<gray>Almacén: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Multiplicador: <gold>x%multiplier%</gold></gray>"
        - ""
