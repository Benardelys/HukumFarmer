no-money-to-collect: "%prefix%<yellow>No hay dinero acumulado para recolectar.</yellow>"
vault-disabled-warning: "%prefix%<red>El plugin de economía (Vault) no está activo en este servidor.</red>"

# Ajustes & Alternadores
toggle-auto-harvest-on: "%prefix%<green>La cosecha automática ahora está <bold>ACTIVADA</bold>.</green>"
toggle-auto-harvest-off: "%prefix%<yellow>La cosecha automática ahora está <bold>DESACTIVADA</bold>.</yellow>"
toggle-auto-sell-on: "%prefix%<green>La venta automática ahora está <bold>ACTIVADA</bold>.</green>"
toggle-auto-sell-off: "%prefix%<yellow>La venta automática ahora está <bold>DESACTIVADA</bold>.</yellow>"
status-enabled: "<green>ACTIVADA</green>"
status-disabled: "<red>DESACTIVADA</red>"

# Sistema de Idiomas
language-changed: "%prefix%<green>¡Tu idioma preferido ha sido actualizado a <yellow>%language%</yellow>!</green>"
