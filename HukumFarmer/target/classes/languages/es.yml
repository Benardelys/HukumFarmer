admin-reset: "%prefix%<green>El granjero del jugador <yellow>%player%</yellow> ha sido restablecido.</green>"
admin-setlevel: "%prefix%<green>Nivel del granjero de <yellow>%player%</yellow> establecido a <yellow>%level%</yellow>.</green>"
