admin-usage-reset: "%prefix%<yellow>Использование: /farmer admin reset <игрок></yellow>"
admin-usage-setlevel: "%prefix%<yellow>Использование: /farmer admin setlevel <игрок> <уровень></yellow>"
admin-usage-addxp: "%prefix%<yellow>Использование: /farmer admin addxp <игрок> <количество></yellow>"
admin-usage-remove: "%prefix%<yellow>Использование: /farmer admin remove <игрок></yellow>"
admin-usage-info: "%prefix%<yellow>Использование: /farmer admin info <игрок></yellow>"

