stats-harvested: "<gray>Всего собрано: <yellow>%harvested% урожая</yellow></gray>"
stats-earnings: "<gray>Всего заработано: <green>%earnings%$</green></gray>"
stats-footer: "<gold>=================================================="

# Сообщения администратора и команды
admin-given: "%prefix%<green>Фермер и NPC успешно выданы игроку <yellow>%player%</yellow>.</green>"
admin-egg-given: "%prefix%<green>✔ Игроку <yellow>%player%</yellow> выдано <yellow>%amount%</yellow> яиц фермера.</green>"
admin-egg-received: "%prefix%<gold>★ Администратор выдал вам <yellow>%amount%</yellow> яиц фермера!</gold>"
admin-reset: "%prefix%<green>Фермер игрока <yellow>%player%</yellow> был сброшен.</green>"
admin-setlevel: "%prefix%<green>Уровень фермера игрока <yellow>%player%</yellow> установлен на <yellow>%level%</yellow>.</green>"
admin-addxp: "%prefix%<green>Добавлено <yellow>%amount% XP</yellow> фермеру игрока <yellow>%player%</yellow>.</green>"
admin-removed: "%prefix%<green>Фермер и NPC игрока <yellow>%player%</yellow> успешно удалены.</green>"
admin-farmer-already-has: "%prefix%<red>У этого игрока уже есть фермер!</red>"

admin-usage-give: "%prefix%<yellow>Использование: /farmer admin give <игрок></yellow>"
admin-usage-give-egg: "%prefix%<yellow>Использование: /farmer admin give <игрок> [количество]</yellow>"
