# Улучшения и уровень
farmer-upgraded: "%prefix%<green>Ваш фермер улучшен до <yellow>Уровня %level%</yellow>!</green>"
farmer-max-level: "%prefix%<yellow>Ваш фермер уже достиг максимального уровня!</yellow>"
not-enough-money-upgrade: "%prefix%<red>Недостаточно денег для улучшения! Требуется: <yellow>%cost%$</yellow></red>"
not-enough-xp-upgrade: "%prefix%<red>Недостаточно опыта для улучшения! Требуется: <yellow>%xp% XP</yellow></red>"

# Хранилище и урожай
storage-full: "%prefix%<red>Хранилище вашего фермера заполнено! Продайте урожай или увеличьте вместимость.</red>"
