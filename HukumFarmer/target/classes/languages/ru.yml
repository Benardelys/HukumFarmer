farmer-item-cannot-place-region: "%prefix%<red>✖ У вас нет прав на установку фермера в этом регионе!</red>"
farmer-purchase-failed-money: "%prefix%<red>Недостаточно средств для покупки фермера! Требуется: <yellow>%price%$</yellow>, Баланс: <gold>%balance%$</gold></red>"
