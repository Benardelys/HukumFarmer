money-collected: "%prefix%<green>Вы забрали накопленные <gold>%amount%$</gold> от фермера на свой баланс!</green>"
no-money-to-collect: "%prefix%<yellow>Нет накопленных средств для получения.</yellow>"
vault-disabled-warning: "%prefix%<red>Плагин экономики (Vault) не активен на этом сервере.</red>"

# Настройки и переключатели
toggle-auto-harvest-on: "%prefix%<green>Автосбор урожая теперь <bold>ВКЛЮЧЕН</bold>.</green>"
toggle-auto-harvest-off: "%prefix%<yellow>Автосбор урожая теперь <bold>ВЫКЛЮЧЕН</bold>.</yellow>"
toggle-auto-sell-on: "%prefix%<green>Автопродажа теперь <bold>ВКЛЮЧЕНА</bold>.</green>"
toggle-auto-sell-off: "%prefix%<yellow>Автопродажа теперь <bold>ВЫКЛЮЧЕНА</bold>.</yellow>"
status-enabled: "<green>ВКЛЮЧЕНО</green>"
status-disabled: "<red>ВЫКЛЮЧЕНО</red>"

# Языковая система
language-changed: "%prefix%<green>Ваш язык изменен на <yellow>%language%</yellow>!</green>"
language-invalid: "%prefix%<red>Неверный код языка! Доступные языки: <yellow>tr, en, de, fr, es, ru</yellow></red>"
admin-language-set: "%prefix%<green>Язык игрока <yellow>%player%</yellow> установлен на <yellow>%language%</yellow>.</green>"

# Статистика
stats-header: "<gold>========== <yellow>Статистика %name%</yellow> =========="
stats-level: "<gray>Уровень: <yellow>%level%</yellow> (<aqua>%xp% XP</aqua>)</gray>"
