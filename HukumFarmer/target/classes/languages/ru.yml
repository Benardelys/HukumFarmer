# Урожай и перевод предметов
crops:
  wheat: "<green>Пшеница</green>"
  carrot: "<gold>Морковь</gold>"
  potato: "<yellow>Картофель</yellow>"
  beetroot: "<red>Свекла</red>"
  sugarcane: "<green>Сахарный Тростник</green>"
  cactus: "<green>Кактус</green>"
  melon: "<green>Арбуз</green>"
  pumpkin: "<gold>Тыква</gold>"
  nether_wart: "<dark_red>Нарост Незера</dark_red>"
  cocoa_beans: "<gold>Какао-бобы</gold>"
  sweet_berries: "<red>Сладкие Ягоды</red>"
  glow_berries: "<yellow>Светящиеся Ягоды</yellow>"
  bamboo: "<green>Бамбук</green>"
  kelp: "<dark_green>Ламинария</dark_green>"

# Перевод меню и GUI
gui:
  main-menu:
    title: "<gold><bold>Панель Управления Фермером</bold></gold>"
    farmer-info:
      name: "<yellow><bold>%farmer_name%</bold></yellow>"
      lore:
        - "<gray>Владелец: <gold>%owner%</gold></gray>"
        - "<gray>Уровень: <aqua>%level%</aqua></gray>"
        - "<gray>Опыт: <green>%xp% / %required_xp% XP</green></gray>"
        - "<gray>Хранилище: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Множитель: <gold>x%multiplier%</gold></gray>"
        - ""
        - "<dark_gray>●</dark_gray> <gray>Накопленный доход: <green>%earnings%$</green></gray>"
        - ""
        - "<yellow>▶ Используйте кнопки меню для управления фермером.</yellow>"
    storage-button:
      name: "<gold><bold>Хранилище Урожая</bold></gold>"
      lore:
        - "<gray>Просматривайте и продавайте урожай,"
        - "<gray>собранный вашим фермером."
        - ""
        - "<gray>Заполнено: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Стоимость урожая: <green>%storage_value%$</green></gray>"
        - ""
        - "<yellow>▶ Нажмите, чтобы открыть хранилище!</yellow>"
    upgrade-button:
      name: "<aqua><bold>Улучшения Фермера</bold></aqua>"
      lore:
        - "<gray>Повышайте уровень фермера для"
        - "<gray>увеличения вместимости и скорости."
        - ""
        - "<gray>Текущий уровень: <yellow>%level%</yellow></gray>"
        - "<gray>Следующий уровень: <green>%next_level%</green></gray>"
        - "<gray>Требуется денег: <gold>%upgrade_cost%$</gold></gray>"
        - "<gray>Требуется XP: <aqua>%upgrade_xp% XP</aqua></gray>"
        - ""
        - "<yellow>▶ Нажмите, чтобы открыть меню улучшений!</yellow>"
    collect-money:
      name: "<green><bold>Собрать Доход</bold></green>"
      lore:
        - "<gray>Переведите накопленные деньги"
        - "<gray>от авто-продажи на ваш баланс."
        - ""
        - "<gray>Накоплено: <gold>%earnings%$</gold></gray>"
        - ""
        - "<yellow>▶ Нажмите, чтобы забрать деньги!</yellow>"
    auto-harvest-toggle:
      name: "<yellow><bold>Авто-Сбор</bold></yellow>"
      lore:
        - "<gray>Автоматически собирает созревший"
        - "<gray>урожай вокруг фермера."
        - ""
        - "<gray>Статус: %auto_harvest_status%"
        - ""
        - "<yellow>▶ Нажмите для переключения!</yellow>"
    auto-sell-toggle:
      name: "<light_purple><bold>Авто-Продажа</bold></light_purple>"
      lore:
        - "<gray>Автоматически продает собранный"
        - "<gray>урожай за игровую валюту."
        - ""
        - "<gray>Статус: %auto_sell_status%"
        - ""
        - "<yellow>▶ Нажмите для переключения!</yellow>"
    stats-button:
      name: "<blue><bold>Статистика Фермера</bold></blue>"
      lore:
        - "<gray>Посмотреть общие объемы сбора"
        - "<gray>и суммарный заработанный доход."
        - ""
        - "<gray>Всего собрано: <yellow>%total_harvested% шт.</yellow></gray>"
        - "<gray>Общий доход: <green>%total_earnings%$</green></gray>"
        - ""
        - "<yellow>▶ Нажмите для просмотра подробностей!</yellow>"
    language-button:
      name: "<aqua><bold>🌐 Настройки Языка</bold></aqua>"
      lore:
        - "<gray>Измените предпочитаемый язык."
        - ""
        - "<yellow>▶ Нажмите для выбора языка!</yellow>"
    close-button:
      name: "<red><bold>Закрыть Меню</bold></red>"
      lore:
        - "<gray>Нажмите, чтобы закрыть окно.</gray>"

  purchase-menu:
    title: "<gold><bold>HukumFarmer - Купить Фермера</bold></gold>"
    info-item:
      name: "<yellow><bold>🌾 Фермер HukumFarmer</bold></yellow>"
      lore:
        - "<gray>Профессиональный автоматический помощник"
        - "<gray>с функциями сбора и продажи урожая."
        - ""
        - "<gray>Стоимость покупки: <gold>%price%$</gold></gray>"
        - "<gray>Ваш баланс: <green>%balance%$</green></gray>"
        - ""
        - "<yellow>▶ Подтвердите ниже для получения Яйца Фермера.</yellow>"
    confirm-button:
      name: "<green><bold>✔ КУПИТЬ ЯЙЦО ФЕРМЕРА</bold></green>"
      lore:
        - "<gray>Цена: <gold>%price%$</gold></gray>"
        - ""
        - "<yellow>▶ Нажмите для подтверждения покупки!</yellow>"
    cancel-button:
      name: "<red><bold>✖ ОТМЕНА</bold></red>"
      lore:
        - "<gray>Нажмите, чтобы закрыть окно.</gray>"
    language-button:
      name: "<aqua><bold>🌐 Изменить Язык</bold></aqua>"
      lore:
        - "<gray>Текущий язык: <yellow>%language%</yellow></gray>"
        - ""
        - "<yellow>▶ Нажмите для выбора языка!</yellow>"

  language-menu:
    title: "<aqua><bold>🌐 Выбор Языка / Language Selection</bold></aqua>"
    back-button:
      name: "<red><bold>Назад</bold></red>"
      lore:
        - "<gray>Вернуться в предыдущее меню.</gray>"

  storage-menu:
    title: "<gold><bold>Хранилище Урожая Фермера</bold></gold>"
    sell-all-button:
      name: "<green><bold>Продать Весь Урожай</bold></green>"
      lore:
        - "<gray>Продать весь урожай из хранилища"
        - "<gray>в один клик по рыночной цене с множителем."
        - ""
        - "<gray>Всего урожая: <yellow>%total_stored_items%</yellow></gray>"
        - "<gray>Ожидаемый доход: <gold>%total_sell_value%$</gold></gray>"
        - ""
        - "<yellow>▶ Нажмите, чтобы продать всё!</yellow>"
    back-button:
      name: "<red><bold>Назад</bold></red>"
      lore:
        - "<gray>Нажмите, чтобы вернуться в главное меню.</gray>"
    info-item:
      name: "<yellow><bold>Информация о Хранилище</bold></yellow>"
      lore:
        - "<gray>Вместимость: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Множитель сбора: <gold>x%multiplier%</gold></gray>"
    crop-lore:
      - "<gray>Количество в хранилище: <yellow>%amount%</yellow></gray>"
      - "<gray>Цена за шт.: <gold>%price%$</gold></gray>"
      - "<gray>Общая стоимость: <green>%total_value%$</green></gray>"
      - ""
      - "<yellow>▶ [Левый клик] Продать 64 шт.</yellow>"
      - "<gold>▶ [Правый клик] Продать ВСЁ</gold>"
      - "<aqua>▶ [Shift+Левый клик] Забрать 64 шт. в инвентарь</aqua>"

  upgrade-menu:
    title: "<aqua><bold>Повышение Уровня Фермера</bold></aqua>"
    current-level-item:
      name: "<yellow><bold>Текущее Состояние (Уровень %level%)</bold></yellow>"
      lore:
        - "<gray>Вместимость хранилища: <yellow>%max_storage%</yellow></gray>"
        - "<gray>Множитель сбора: <gold>x%multiplier%</gold></gray>"
        - "<gray>Скорость сбора: <aqua>%harvest_speed% сек.</aqua></gray>"
        - "<gray>Радиус сбора: <green>%harvest_radius% блоков</green></gray>"
    upgrade-action-button:
      name: "<green><bold>Улучшить до Уровня %next_level%</bold></green>"
      lore:
        - "<gray>Новая вместимость: <yellow>%next_max_storage%</yellow></gray>"
        - "<gray>Новый множитель: <gold>x%next_multiplier%</gold></gray>"
        - "<gray>Новая скорость: <aqua>%next_harvest_speed% сек.</aqua></gray>"
        - "<gray>Новый радиус: <green>%next_harvest_radius% блоков</green></gray>"
        - ""
        - "<gray>Требуется денег: <gold>%upgrade_cost%$</gold></gray>"
        - "<gray>Требуется XP: <aqua>%upgrade_xp% XP</aqua></gray>"
        - ""
        - "<yellow>▶ Нажмите для улучшения!</yellow>"
    back-button:
      name: "<red><bold>Назад</bold></red>"
      lore:
        - "<gray>Вернуться в главное меню.</gray>"

  settings-menu:
    title: "<dark_purple><bold>Настройки Фермера</bold></dark_purple>"
    rename-button:
      name: "<yellow><bold>Переименовать Фермера</bold></yellow>"
      lore:
        - "<gray>Задайте уникальное имя вашему фермеру.</gray>"
        - ""
        - "<gray>Текущее имя: <white>%farmer_name%</white></gray>"
        - ""
        - "<yellow>▶ Нажмите, чтобы ввести имя в чат!</yellow>"
    toggle-harvest:
      name: "<green><bold>Авто-Сбор</bold></green>"
      lore:
        - "<gray>Статус: %auto_harvest_status%"
        - ""
        - "<yellow>▶ Нажмите для переключения!</yellow>"
    toggle-sell:
      name: "<light_purple><bold>Авто-Продажа</bold></light_purple>"
      lore:
        - "<gray>Статус: %auto_sell_status%"
        - ""
        - "<yellow>▶ Нажмите для переключения!</yellow>"
    language-button:
      name: "<aqua><bold>🌐 Изменить Язык</bold></aqua>"
      lore:
        - "<gray>Обновите настройки языка.</gray>"
        - ""
        - "<yellow>▶ Нажмите для выбора!</yellow>"
    back-button:
      name: "<red><bold>Назад</bold></red>"
      lore:
        - "<gray>Вернуться в главное меню.</gray>"
