        - "<gray>Erntetempo: <aqua>%harvest_speed%s</aqua></gray>"
        - "<gray>Ernteradius: <green>%harvest_radius% Blöcke</green></gray>"
    upgrade-action-button:
      name: "<green><bold>Auf Level %next_level% Upgraden</bold></green>"
