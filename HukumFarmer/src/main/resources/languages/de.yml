# GUI Übersetzungen
gui:
  main-menu:
    title: "<gold><bold>Farmer-Verwaltungsmenü</bold></gold>"
    farmer-info:
      name: "<yellow><bold>%farmer_name%</bold></yellow>"
      lore:
        - "<gray>Besitzer: <gold>%owner%</gold></gray>"
        - "<gray>Level: <aqua>%level%</aqua></gray>"
        - "<gray>Erfahrung: <green>%xp% / %required_xp% XP</green></gray>"
        - "<gray>Lagerstatus: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Ernte-Multiplikator: <gold>x%multiplier%</gold></gray>"
        - ""
        - "<dark_gray>●</dark_gray> <gray>Gesammelte Einnahmen: <green>%earnings%$</green></gray>"
        - ""
        - "<yellow>▶ Nutze die Schaltflächen zur Verwaltung.</yellow>"
    storage-button:
      name: "<gold><bold>Pflanzenlager</bold></gold>"
      lore:
        - "<gray>Ernteerträge ansehen und"
        - "<gray>direkt auf dem Markt verkaufen."
        - ""
        - "<gray>Belegt: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Lagerwert: <green>%storage_value%$</green></gray>"
        - ""
        - "<yellow>▶ Klicken, um Lager zu öffnen!</yellow>"
    upgrade-button:
      name: "<aqua><bold>Farmer Upgrades</bold></aqua>"
      lore:
        - "<gray>Erhöhe das Farmer-Level für"
        - "<gray>höhere Kapazität und Geschwindigkeit."
        - ""
        - "<gray>Aktuelles Level: <yellow>%level%</yellow></gray>"
        - "<gray>Nächstes Level: <green>%next_level%</green></gray>"
        - "<gray>Benötigtes Geld: <gold>%upgrade_cost%$</gold></gray>"
        - "<gray>Benötigte XP: <aqua>%upgrade_xp% XP</aqua></gray>"
        - ""
        - "<yellow>▶ Klicken, um Upgrades zu öffnen!</yellow>"
    collect-money:
      name: "<green><bold>Einnahmen Abholen</bold></green>"
      lore:
        - "<gray>Übertrage angesammeltes Geld"
        - "<gray>direkt auf dein Spielerkonto."
        - ""
        - "<gray>Angesammelt: <gold>%earnings%$</gold></gray>"
        - ""
        - "<yellow>▶ Klicken zum Abholen!</yellow>"
    auto-harvest-toggle:
      name: "<yellow><bold>Auto-Ernte</bold></yellow>"
      lore:
        - "<gray>Erntet reife Pflanzen im"
        - "<gray>Umkreis automatisch ab."
        - ""
        - "<gray>Status: %auto_harvest_status%"
        - ""
        - "<yellow>▶ Klicken zum Umschalten!</yellow>"
    auto-sell-toggle:
      name: "<light_purple><bold>Auto-Verkauf</bold></light_purple>"
      lore:
        - "<gray>Verkauft geerntete Pflanzen"
        - "<gray>automatisch für Geld."
        - ""
        - "<gray>Status: %auto_sell_status%"
        - ""
        - "<yellow>▶ Klicken zum Umschalten!</yellow>"
    stats-button:
      name: "<blue><bold>Farmer Statistiken</bold></blue>"
      lore:
        - "<gray>Erntemengen und historische"
        - "<gray>Einnahmen deines Farmers ansehen."
        - ""
        - "<gray>Gesamt Geerntet: <yellow>%total_harvested% Stück</yellow></gray>"
        - "<gray>Gesamte Einnahmen: <green>%total_earnings%$</green></gray>"
        - ""
        - "<yellow>▶ Klicken für Details!</yellow>"
    language-button:
      name: "<aqua><bold>🌐 Spracheinstellungen</bold></aqua>"
      lore:
        - "<gray>Ändere deine bevorzugte Sprache."
        - ""
        - "<yellow>▶ Klicken für Sprachauswahl!</yellow>"
    close-button:
      name: "<red><bold>Menü Schließen</bold></red>"
      lore:
        - "<gray>Klicken zum Schließen des Fensters.</gray>"

  purchase-menu:
    title: "<gold><bold>HukumFarmer - Farmer Kaufen</bold></gold>"
    info-item:
      name: "<yellow><bold>🌾 HukumFarmer Farmer</bold></yellow>"
      lore:
        - "<gray>Ein professioneller automatischer Helfer"
        - "<gray>mit Ernte- und Verkaufsfunktionen."
        - ""
        - "<gray>Kaufpreis: <gold>%price%$</gold></gray>"
        - "<gray>Dein Guthaben: <green>%balance%$</green></gray>"
        - ""
        - "<yellow>▶ Bestätige, um das Farmer-Ei zu erhalten.</yellow>"
    confirm-button:
      name: "<green><bold>✔ FARMER-EI KAUFEN</bold></green>"
      lore:
        - "<gray>Preis: <gold>%price%$</gold></gray>"
        - ""
        - "<yellow>▶ Klicken zum Bestätigen!</yellow>"
    cancel-button:
      name: "<red><bold>✖ ABBRECHEN</bold></red>"
      lore:
        - "<gray>Klicken zum Schließen.</gray>"
    language-button:
      name: "<aqua><bold>🌐 Sprache Ändern</bold></aqua>"
      lore:
        - "<gray>Aktuelle Sprache: <yellow>%language%</yellow></gray>"
        - ""
        - "<yellow>▶ Klicken zum Wechseln!</yellow>"

  language-menu:
    title: "<aqua><bold>🌐 Sprachauswahl / Language Selection</bold></aqua>"
    back-button:
      name: "<red><bold>Zurück</bold></red>"
      lore:
        - "<gray>Zum vorherigen Menü zurückkehren.</gray>"

  storage-menu:
    title: "<gold><bold>Farmer-Pflanzenlager</bold></gold>"
    sell-all-button:
      name: "<green><bold>Alles Verkaufen</bold></green>"
      lore:
        - "<gray>Verkauft alle gelagerten Erträge"
        - "<gray>auf einmal zum Marktpreis."
        - ""
        - "<gray>Gesamtmenge: <yellow>%total_stored_items%</yellow></gray>"
        - "<gray>Geschätzter Erlös: <gold>%total_sell_value%$</gold></gray>"
        - ""
        - "<yellow>▶ Klicken, um alles zu verkaufen!</yellow>"
    back-button:
      name: "<red><bold>Zurück</bold></red>"
      lore:
        - "<gray>Zum Hauptmenü zurückkehren.</gray>"
    info-item:
      name: "<yellow><bold>Lagerinfo</bold></yellow>"
      lore:
        - "<gray>Kapazität: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Ernte-Multiplikator: <gold>x%multiplier%</gold></gray>"
    crop-lore:
      - "<gray>Gelagerte Menge: <yellow>%amount%</yellow></gray>"
      - "<gray>Stückpreis: <gold>%price%$</gold></gray>"
      - "<gray>Gesamtwert: <green>%total_value%$</green></gray>"
      - ""
      - "<yellow>▶ [Linksklick] 64 Stück verkaufen</yellow>"
      - "<gold>▶ [Rechtsklick] ALLES verkaufen</gold>"
      - "<aqua>▶ [Shift+Linksklick] 64 ins Inventar nehmen</aqua>"

  upgrade-menu:
    title: "<aqua><bold>Farmer Level-Upgrade</bold></aqua>"
    current-level-item:
      name: "<yellow><bold>Aktueller Status (Level %level%)</bold></yellow>"
      lore:
