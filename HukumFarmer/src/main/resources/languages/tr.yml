# Menü & GUI Yerelleştirmeleri
gui:
  main-menu:
    title: "<gold><bold>Çiftçi Yönetim Paneli</bold></gold>"
    farmer-info:
      name: "<yellow><bold>%farmer_name%</bold></yellow>"
      lore:
        - "<gray>Sahip: <gold>%owner%</gold></gray>"
        - "<gray>Seviye: <aqua>%level%</aqua></gray>"
        - "<gray>Deneyim: <green>%xp% / %required_xp% XP</green></gray>"
        - "<gray>Depo Durumu: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Hasat Çarpanı: <gold>x%multiplier%</gold></gray>"
        - ""
        - "<dark_gray>●</dark_gray> <gray>Birikmiş Kazanç: <green>%earnings%$</green></gray>"
        - ""
        - "<yellow>▶ Menü butonlarını kullanarak çiftçinizi yönetin.</yellow>"
    storage-button:
      name: "<gold><bold>Ürün Deposu</bold></gold>"
      lore:
        - "<gray>Çiftçinizin topladığı ürünleri"
        - "<gray>görüntüleyin ve satın."
        - ""
        - "<gray>Dolu Alan: <yellow>%current_storage% / %max_storage%</yellow></gray>"
        - "<gray>Depo Değeri: <green>%storage_value%$</green></gray>"
        - ""
        - "<yellow>▶ Tıkla ve depoyu aç!</yellow>"
    upgrade-button:
      name: "<aqua><bold>Çiftçi Yükseltmeleri</bold></aqua>"
      lore:
        - "<gray>Çiftçinizin seviyesini yükselterek"
        - "<gray>kapasite ve hızını artırın."
        - ""
        - "<gray>Mevcut Seviye: <yellow>%level%</yellow></gray>"
        - "<gray>Sonraki Seviye: <green>%next_level%</green></gray>"
        - "<gray>Gerekli Para: <gold>%upgrade_cost%$</gold></gray>"
        - "<gray>Gerekli XP: <aqua>%upgrade_xp% XP</aqua></gray>"
        - ""
        - "<yellow>▶ Tıkla ve yükseltme menüsünü aç!</yellow>"
    collect-money:
      name: "<green><bold>Kazancı Topla</bold></green>"
      lore:
        - "<gray>Otomatik satıştan biriken parayı"
        - "<gray>cüzdanınıza aktarın."
        - ""
        - "<gray>Biriken Tutar: <gold>%earnings%$</gold></gray>"
        - ""
        - "<yellow>▶ Tıkla ve parayı topla!</yellow>"
    auto-harvest-toggle:
      name: "<yellow><bold>Otomatik Hasat</bold></yellow>"
      lore:
        - "<gray>Çiftçinin etraftaki olgunlaşmış"
        - "<gray>ürünleri otomatik hasat etmesini sağlar."
        - ""
        - "<gray>Durum: %auto_harvest_status%"
        - ""
        - "<yellow>▶ Durumu değiştirmek için tıkla!</yellow>"
