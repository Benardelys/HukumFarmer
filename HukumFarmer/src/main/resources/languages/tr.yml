      name: "<light_purple><bold>Otomatik Satış</bold></light_purple>"
      lore:
        - "<gray>Hasat edilen ürünlerin otomatik"
        - "<gray>olarak paraya çevrilmesini sağlar."
        - ""
        - "<gray>Durum: %auto_sell_status%"
        - ""
        - "<yellow>▶ Durumu değiştirmek için tıkla!</yellow>"
    stats-button:
      name: "<blue><bold>Çiftçi İstatistikleri</bold></blue>"
      lore:
        - "<gray>Çiftçinizin geçmiş performansını"
        - "<gray>ve toplam hasat verilerini inceleyin."
        - ""
        - "<gray>Toplam Hasat: <yellow>%total_harvested% adet</yellow></gray>"
        - "<gray>Toplam Kazanç: <green>%total_earnings%$</green></gray>"
        - ""
        - "<yellow>▶ Tıkla ve detayları gör!</yellow>"
    language-button:
      name: "<aqua><bold>🌐 Dil Ayarları</bold></aqua>"
      lore:
        - "<gray>Dil tercihinizi değiştirin."
        - ""
        - "<yellow>▶ Dil menüsünü açmak için tıkla!</yellow>"
    close-button:
      name: "<red><bold>Menüyü Kapat</bold></red>"
      lore:
        - "<gray>Pencereyi kapatmak için tıklayın.</gray>"

