toggle-auto-harvest-off: "%prefix%<yellow>La récolte automatique est désormais <bold>DÉSACTIVÉE</bold>.</yellow>"
toggle-auto-sell-on: "%prefix%<green>La vente automatique est désormais <bold>ACTIVÉE</bold>.</green>"
toggle-auto-sell-off: "%prefix%<yellow>La vente automatique est désormais <bold>DÉSACTIVÉE</bold>.</yellow>"
