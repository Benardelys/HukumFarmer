admin-help-reset: "<yellow>/farmer admin reset <player></yellow> <gray>- Resets player farmer</gray>"
admin-help-setlevel: "<yellow>/farmer admin setlevel <player> <level></yellow> <gray>- Sets farmer level</gray>"
admin-help-addxp: "<yellow>/farmer admin addxp <player> <amount></yellow> <gray>- Adds XP to farmer</gray>"
