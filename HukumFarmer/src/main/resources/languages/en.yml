admin-info-storage: "<gray>Total Stored: <yellow>%stored%</yellow></gray>"
admin-info-earnings: "<gray>Accumulated Earnings: <green>%earnings%$</green></gray>"
admin-info-autoharvest: "<gray>Auto Harvest: %status%</gray>"
