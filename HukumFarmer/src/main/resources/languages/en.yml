    language-button:
      name: "<aqua><bold>🌐 Language Settings</bold></aqua>"
      lore:
        - "<gray>Change your preferred language."
        - ""
        - "<yellow>▶ Click to open language menu!</yellow>"
    close-button:
      name: "<red><bold>Close Menu</bold></red>"
