# ==============================================================================
#                      HukumFarmer - English Language File (en.yml)
# ==============================================================================

prefix: "<gold><bold>HukumFarmer</bold></gold> <dark_gray>»</dark_gray> "

# General & System Messages
no-permission: "%prefix%<red>You do not have permission to perform this action!</red>"
player-only: "%prefix%<red>Only players can execute this command!</red>"
player-not-found: "%prefix%<red>Specified player was not found or is offline.</red>"
invalid-amount: "%prefix%<red>You specified an invalid amount!</red>"
invalid-level: "%prefix%<red>You specified an invalid level!</red>"
reloaded: "%prefix%<green>All configuration and language files have been reloaded successfully.</green>"

# Purchase & Farmer Status
farmer-already-exists: "%prefix%<red>You have already reached your maximum farmer limit! Type <yellow>/farmer</yellow> to open the menu.</red>"
farmer-not-found: "%prefix%<red>You do not own a farmer yet! Type <yellow>/farmer</yellow> to purchase one.</red>"
farmer-purchase-success: "%prefix%<green>Congratulations! Your farmer has been successfully purchased and created for <gold>%price%$</gold>.</green>"
purchase-success-egg: "%prefix%<green>✔ Farmer Egg successfully purchased for <gold>%price%$</gold>! Added to your inventory.</green>"
farmer-placed: "%prefix%<green>✔ Farmer successfully placed and spawned!</green>"
farmer-creation-failed: "%prefix%<red>✖ An error occurred while creating your farmer. Your egg was not consumed.</red>"
inventory-full: "%prefix%<red>✖ Your inventory is full! Transaction cannot be completed.</red>"
farmer-item-cannot-place-region: "%prefix%<red>✖ You do not have permission to place a farmer in this region!</red>"
farmer-purchase-failed-money: "%prefix%<red>You do not have enough money to purchase a farmer! Required: <yellow>%price%$</yellow>, Balance: <gold>%balance%$</gold></red>"
farmer-purchase-in-progress: "%prefix%<yellow>Your purchase transaction is already in progress, please wait...</yellow>"
farmer-purchase-error: "%prefix%<red>An error occurred while creating your farmer. Your money was not deducted or has been refunded.</red>"
farmer-purchase-disabled: "%prefix%<red>Farmer purchasing is currently disabled.</red>"
farmer-limit-reached: "%prefix%<red>You have reached the maximum allowed farmers limit (<yellow>%max%</yellow>)!</red>"
farmer-location-invalid: "%prefix%<red>Cannot create a farmer at your current position! Please stand on a valid block.</red>"
farmer-invalid-location: "%prefix%<red>Cannot place farmer at this location! Please select a valid ground block.</red>"
farmer-renamed: "%prefix%<green>Your farmer has been renamed to <yellow>%name%</yellow>.</green>"
farmer-name-too-long: "%prefix%<red>Farmer name cannot exceed %max% characters!</red>"
rename-prompt: "%prefix%<yellow>Please type your farmer's new name in chat. (Type <red>cancel</red> to abort)</yellow>"
rename-cancelled: "%prefix%<yellow>Farmer renaming has been cancelled.</yellow>"

# Upgrades & Level
farmer-upgraded: "%prefix%<green>Your farmer has been upgraded to <yellow>Level %level%</yellow>!</green>"
farmer-max-level: "%prefix%<yellow>Your farmer is already at the maximum level!</yellow>"
not-enough-money-upgrade: "%prefix%<red>Not enough money for upgrade! Required: <yellow>%cost%$</yellow></red>"
not-enough-xp-upgrade: "%prefix%<red>Not enough experience for upgrade! Required: <yellow>%xp% XP</yellow></red>"

# Storage & Harvest
storage-full: "%prefix%<red>Your farmer's storage is completely full! Sell crops or upgrade storage capacity.</red>"
crops-harvested: "%prefix%<green>Your farmer harvested <yellow>%amount%</yellow> crops!</green>"

# Selling & Economy
not-enough-crops: "%prefix%<red>There are no crops available to sell in your storage!</red>"
crop-sold: "%prefix%<green>Sold <yellow>%amount% %crop%</yellow> from storage! Earned: <gold>%money%$</gold></green>"
all-crops-sold: "%prefix%<green>All crops (<yellow>%amount% total</yellow>) sold! Earned: <gold>%money%$</gold></green>"
money-collected: "%prefix%<green>Collected accumulated <gold>%amount%$</gold> from your farmer to your balance!</green>"
no-money-to-collect: "%prefix%<yellow>There is no accumulated money to collect from your farmer.</yellow>"
vault-disabled-warning: "%prefix%<red>Economy plugin (Vault) is not active on this server.</red>"

# Settings & Toggles
toggle-auto-harvest-on: "%prefix%<green>Auto Harvest system is now <bold>ENABLED</bold>.</green>"
toggle-auto-harvest-off: "%prefix%<yellow>Auto Harvest system is now <bold>DISABLED</bold>.</yellow>"
toggle-auto-sell-on: "%prefix%<green>Auto Sell system is now <bold>ENABLED</bold>.</green>"
toggle-auto-sell-off: "%prefix%<yellow>Auto Sell system is now <bold>DISABLED</bold>.</yellow>"
status-enabled: "<green>ENABLED</green>"
status-disabled: "<red>DISABLED</red>"

# Language System
language-changed: "%prefix%<green>Your preferred language has been updated to <yellow>%language%</yellow>!</green>"
language-invalid: "%prefix%<red>Invalid language code! Available languages: <yellow>tr, en, de, fr, es, ru</yellow></red>"
admin-language-set: "%prefix%<green>Language for <yellow>%player%</yellow> has been set to <yellow>%language%</yellow>.</green>"

# Statistics
stats-header: "<gold>========== <yellow>%name% Statistics</yellow> =========="
stats-level: "<gray>Level: <yellow>%level%</yellow> (<aqua>%xp% XP</aqua>)</gray>"
stats-multiplier: "<gray>Harvest Multiplier: <gold>x%multiplier%</gold></gray>"
stats-storage: "<gray>Storage Status: <yellow>%stored% / %max%</yellow></gray>"
stats-harvested: "<gray>Total Harvested: <yellow>%harvested% items</yellow></gray>"
stats-earnings: "<gray>Total Earned Money: <green>%earnings%$</green></gray>"
stats-footer: "<gold>=================================================="

# Admin Messages & Usages
admin-given: "%prefix%<green>Granted a farmer and dedicated NPC to <yellow>%player%</yellow>.</green>"
admin-egg-given: "%prefix%<green>✔ Given <yellow>%amount%</yellow> Farmer Egg(s) to <yellow>%player%</yellow>.</green>"
admin-egg-received: "%prefix%<gold>★ An administrator gave you <yellow>%amount%</yellow> Farmer Egg(s)!</gold>"
admin-reset: "%prefix%<green>Farmer of player <yellow>%player%</yellow> has been reset.</green>"
admin-setlevel: "%prefix%<green>Set farmer level of <yellow>%player%</yellow> to <yellow>%level%</yellow>.</green>"
admin-addxp: "%prefix%<green>Added <yellow>%amount% XP</yellow> to farmer of <yellow>%player%</yellow>.</green>"
admin-removed: "%prefix%<green>Successfully deleted farmer and NPC of <yellow>%player%</yellow>.</green>"
admin-farmer-already-has: "%prefix%<red>This player already owns a farmer!</red>"

admin-usage-give: "%prefix%<yellow>Usage: /farmer admin give <player></yellow>"
admin-usage-give-egg: "%prefix%<yellow>Usage: /farmer admin give <player> [amount]</yellow>"
admin-usage-language: "%prefix%<yellow>Usage: /farmer admin language <player> <tr|en|de|fr|es|ru></yellow>"
admin-usage-reset: "%prefix%<yellow>Usage: /farmer admin reset <player></yellow>"
admin-usage-setlevel: "%prefix%<yellow>Usage: /farmer admin setlevel <player> <level></yellow>"
admin-usage-addxp: "%prefix%<yellow>Usage: /farmer admin addxp <player> <amount></yellow>"
admin-usage-remove: "%prefix%<yellow>Usage: /farmer admin remove <player></yellow>"
admin-usage-info: "%prefix%<yellow>Usage: /farmer admin info <player></yellow>"

admin-help-header: "<gold>========== HukumFarmer Admin Commands =========="
